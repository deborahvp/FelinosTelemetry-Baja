# Vehicle goals → measurable requirements → test method (DVP&R).
- id: VG-04
  title: Acceleration 100 ft
  metric: time_100ft_s
  criterion: {op: "<=", value: 4.3}
  method: acceleration
  min_runs: 3
- id: VG-05
  title: Turning radius at ~5 mph (inner tire line)
