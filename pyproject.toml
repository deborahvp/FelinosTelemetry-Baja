[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "felinos-telemetry"
version = "0.1.0"
description = "Vehicle data acquisition and verification pipeline for the Felinos Racing Baja SAE prototype."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Deborah Villicaña Prieto", email = "deborahvillicana@outlook.com" }]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "paho-mqtt>=2.0",
    "typer>=0.12",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
analysis = ["scipy>=1.12", "matplotlib>=3.8"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pandas-stubs>=2.2",
    "types-PyYAML>=6.0",
]

[project.scripts]
felinos = "felinos_telemetry.cli:app"

[project.urls]
Repository = "https://github.com/felinos-racing/felinos-telemetry"

[tool.hatch.build.targets.wheel]
packages = ["src/felinos_telemetry"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PT"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["felinos_telemetry"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["paho.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["felinos_telemetry"]
branch = true
